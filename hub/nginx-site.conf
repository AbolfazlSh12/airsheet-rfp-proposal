# One subdomain for every proposal. Replace proposals.example.com and the certificate paths.
# If nginx itself runs in Docker, put both containers on one network and use  proxy_pass http://proposals-hub:8080;
server {
    listen 80;
    server_name proposals.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name proposals.example.com;

    ssl_certificate     /etc/letsencrypt/live/proposals.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proposals.example.com/privkey.pem;

    client_max_body_size 128k;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
